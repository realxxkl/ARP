<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pyramid AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="infoBox">
    <p id="infoText">Tap a point on the pyramid</p>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
  >

    <a-assets timeout="60000">
      <a-asset-item id="pyramidModel" 
        src="https://pub-d9b652f6ddbe4044a30f53bdad7edf85.r2.dev/full.glb"
        crossorigin="anonymous">
      </a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity 
        gltf-model="#pyramidModel"
        scale="0.01 0.01 0.01"
        position="0 0 0"
        rotation="-90 0 0"
      </a-entity>

      <a-sphere position="0 1 0" radius="0.1" color="red"
        onclick="showInfo('Top: The pyramid once had a golden capstone.')">
      </a-sphere>

      <a-sphere position="0 0.5 0.3" radius="0.1" color="blue"
        onclick="showInfo('Built for Pharaoh Khufu around 2560 BCE.')">
      </a-sphere>

      <a-sphere position="0 0 0" radius="0.1" color="green"
        onclick="showInfo('Made of over 2.3 million limestone blocks.')">
      </a-sphere>

    </a-entity>

  </a-scene>

  <script src="script.js"></script>
</body>
</html>
