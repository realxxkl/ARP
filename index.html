<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pyramid AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-overlay">

    <div id="header">
      <span id="logo">&#9651; PYRAMID AR</span>
      <span id="status-badge" class="badge scanning">Scanning…</span>
    </div>

    <div id="hint-box">
      <div id="hint-icon">&#9651;</div>
      <p id="hint-text">Point your camera at the target image</p>
    </div>

    <div id="info-card" class="hidden">
      <button id="info-close" onclick="closeInfo()">&#x2715;</button>
      <h2 id="info-title"></h2>
      <p id="info-body"></p>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="btn-editor" onclick="togglePanel()">
        &#9881; Adjust Model
      </button>
    </div>

  </div>

  <!-- Editor Panel -->
  <div id="editorPanel">
    <div id="editor-header">
      <span>Position Editor</span>
      <button onclick="togglePanel()">&#x2715;</button>
    </div>

    <label>Scale: <span id="scaleVal">0.01</span></label>
    <input type="range" min="1" max="200" value="10" id="scaleSlider" oninput="updateModel()">

    <label>Position X (left / right): <span id="pxVal">0</span></label>
    <input type="range" min="-20" max="20" value="0" id="pxSlider" oninput="updateModel()">

    <label>Position Y (up / down): <span id="pyVal">0</span></label>
    <input type="range" min="-20" max="20" value="0" id="pySlider" oninput="updateModel()">

    <label>Position Z (forward / back): <span id="pzVal">0</span></label>
    <input type="range" min="-20" max="20" value="0" id="pzSlider" oninput="updateModel()">

    <label>Rotation X (tilt): <span id="rxVal">0</span></label>
    <input type="range" min="-180" max="180" value="0" id="rxSlider" oninput="updateModel()">

    <label>Rotation Y (spin): <span id="ryVal">0</span></label>
    <input type="range" min="-180" max="180" value="0" id="rySlider" oninput="updateModel()">

    <pre id="codeOutput"></pre>
    <div id="editor-actions">
      <button onclick="copyCode()">&#10003; Copy Code</button>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 30; warmupTolerance: 5;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
  >

    <a-assets timeout="60000">
      <a-asset-item id="pyramidModel"
        src="full.glb"
        crossorigin="anonymous">
      </a-asset-item>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffe0a0" intensity="1.2" position="1 3 2"></a-light>
    <a-light type="directional" color="#a0c8ff" intensity="0.4" position="-2 1 -1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target entity: freeze fix keeps it visible after target is lost -->
    <a-entity id="target-entity" mindar-image-target="targetIndex: 0">

      <a-entity
        id="pyramidEntity"
        gltf-model="#pyramidModel"
        scale="0.01 0.01 0.01"
        position="0 0 0"
        rotation="0 0 0">
      </a-entity>

      <!-- Gold hotspot — top -->
      <a-entity class="hotspot" position="0 0.22 0"
        data-title="The Golden Capstone"
        data-body="The apex of the Great Pyramid was once capped with electrum — an alloy of gold and silver — reflecting sunlight across the Nile valley."
        onclick="showInfo(this)">
        <a-sphere radius="0.035" color="#FFD700" material="shader: flat; opacity: 0.9"
          animation__pulse="property: scale; to: 1.35 1.35 1.35; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
        </a-sphere>
      </a-entity>

      <!-- Blue hotspot — right -->
      <a-entity class="hotspot" position="0.15 0.1 0"
        data-title="Built for Khufu"
        data-body="Constructed around 2560 BCE for Pharaoh Khufu, it stood as the tallest man-made structure on Earth for over 3,800 years."
        onclick="showInfo(this)">
        <a-sphere radius="0.035" color="#4FC3F7" material="shader: flat; opacity: 0.9"
          animation__pulse="property: scale; to: 1.35 1.35 1.35; dir: alternate; loop: true; dur: 1100; easing: easeInOutSine">
        </a-sphere>
      </a-entity>

      <!-- Green hotspot — left -->
      <a-entity class="hotspot" position="-0.15 0.1 0"
        data-title="2.3 Million Blocks"
        data-body="The pyramid contains an estimated 2.3 million limestone and granite blocks, each weighing between 2.5 and 80 tonnes."
        onclick="showInfo(this)">
        <a-sphere radius="0.035" color="#81C784" material="shader: flat; opacity: 0.9"
          animation__pulse="property: scale; to: 1.35 1.35 1.35; dir: alternate; loop: true; dur: 1300; easing: easeInOutSine">
        </a-sphere>
      </a-entity>

      <!-- Purple hotspot — front -->
      <a-entity class="hotspot" position="0 0.05 0.18"
        data-title="The Grand Gallery"
        data-body="Inside lies the Grand Gallery — a soaring corbelled passageway 8.7 metres tall leading to the King's Chamber with extraordinary precision."
        onclick="showInfo(this)">
        <a-sphere radius="0.035" color="#CE93D8" material="shader: flat; opacity: 0.9"
          animation__pulse="property: scale; to: 1.35 1.35 1.35; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
        </a-sphere>
      </a-entity>

    </a-entity>

  </a-scene>

  <script src="script.js"></script>
</body>
</html>
