<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pyramid AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-overlay">

    <div id="header">
      <span id="logo">&#9651; PYRAMID AR</span>
      <span id="status-badge" class="badge scanning">Scanning…</span>
    </div>

    <div id="hint-box">
      <div id="hint-icon">&#8635;</div>
      <p id="hint-text">Move your camera slowly to detect a flat surface</p>
    </div>

    <div id="info-card" class="hidden">
      <button id="info-close" onclick="closeInfo()">&#x2715;</button>
      <h2 id="info-title"></h2>
      <p id="info-body"></p>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="btn-place" onclick="placePyramid()" disabled>
        <span>&#9651;</span> Place Pyramid
      </button>
      <button class="ctrl-btn secondary" id="btn-reset" onclick="resetPyramid()" disabled>
        <span>&#8635;</span> Reset
      </button>
    </div>

  </div>

  <!-- A-Frame Scene -->
  <a-scene
    id="ar-scene"
    webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay, local-floor; overlayElement: #ui-overlay;"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    background="transparent: true"
    ar-hit-test="target: #reticle; type: footprint; footprintDepth: 0.1"
  >

    <a-assets timeout="60000">
      <a-asset-item id="pyramidModel" src="full.glb" crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <!-- Lighting -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffe0a0" intensity="1.2" position="1 3 2"></a-light>
    <a-light type="directional" color="#a0c8ff" intensity="0.4" position="-2 1 -1"></a-light>

    <!-- Reticle (surface indicator) -->
    <a-entity id="reticle" visible="false">
      <a-ring
        color="#FFD700"
        radius-inner="0.06"
        radius-outer="0.10"
        rotation="-90 0 0"
        material="shader: flat; opacity: 0.85"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 2000; easing: linear">
      </a-ring>
      <a-ring
        color="#ffffff"
        radius-inner="0.03"
        radius-outer="0.05"
        rotation="-90 0 0"
        material="shader: flat; opacity: 0.4">
      </a-ring>
    </a-entity>

    <!-- Pyramid entity (placed on tap) -->
    <a-entity id="pyramid-root" visible="false">

      <!-- The GLB model -->
      <a-entity
        id="pyramidEntity"
        gltf-model="#pyramidModel"
        scale="0.005 0.005 0.005"
        position="0 0 0"
        rotation="0 0 0"
        animation__appear="property: scale; from: 0 0 0; to: 0.005 0.005 0.005; dur: 600; easing: easeOutBack; startEvents: appear">
      </a-entity>

      <!-- Info hotspots -->
      <a-entity id="hotspots">

        <!-- Top hotspot -->
        <a-entity
          class="hotspot"
          position="0 0.25 0"
          data-title="The Golden Capstone"
          data-body="The apex of the Great Pyramid was once capped with electrum — an alloy of gold and silver — that reflected sunlight across the Nile valley."
          onclick="showInfo(this)">
          <a-sphere radius="0.035" color="#FFD700" material="shader: flat; opacity: 0.9"
            animation__pulse="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
          </a-sphere>
          <a-ring radius-inner="0.04" radius-outer="0.055" color="#FFD700"
            rotation="-90 0 0" material="shader: flat; opacity: 0.4"
            animation__spin="property: rotation; to: -90 360 0; loop: true; dur: 3000; easing: linear">
          </a-ring>
        </a-entity>

        <!-- Side hotspot 1 -->
        <a-entity
          class="hotspot"
          position="0.15 0.1 0"
          data-title="Built for Khufu"
          data-body="Constructed around 2560 BCE for Pharaoh Khufu, the Great Pyramid stood as the tallest man-made structure on Earth for over 3,800 years."
          onclick="showInfo(this)">
          <a-sphere radius="0.035" color="#4FC3F7" material="shader: flat; opacity: 0.9"
            animation__pulse="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 1100; easing: easeInOutSine">
          </a-sphere>
          <a-ring radius-inner="0.04" radius-outer="0.055" color="#4FC3F7"
            rotation="-90 0 0" material="shader: flat; opacity: 0.4"
            animation__spin="property: rotation; to: -90 360 0; loop: true; dur: 3500; easing: linear">
          </a-ring>
        </a-entity>

        <!-- Side hotspot 2 -->
        <a-entity
          class="hotspot"
          position="-0.15 0.1 0"
          data-title="2.3 Million Blocks"
          data-body="The pyramid contains an estimated 2.3 million limestone and granite blocks, each weighing between 2.5 and 80 tonnes."
          onclick="showInfo(this)">
          <a-sphere radius="0.035" color="#81C784" material="shader: flat; opacity: 0.9"
            animation__pulse="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 1300; easing: easeInOutSine">
          </a-sphere>
          <a-ring radius-inner="0.04" radius-outer="0.055" color="#81C784"
            rotation="-90 0 0" material="shader: flat; opacity: 0.4"
            animation__spin="property: rotation; to: -90 360 0; loop: true; dur: 2800; easing: linear">
          </a-ring>
        </a-entity>

        <!-- Front hotspot -->
        <a-entity
          class="hotspot"
          position="0 0.05 0.18"
          data-title="The Grand Gallery"
          data-body="Inside lies the Grand Gallery — a soaring corbelled passageway 8.7 metres tall, leading to the King's Chamber with absolute precision."
          onclick="showInfo(this)">
          <a-sphere radius="0.035" color="#CE93D8" material="shader: flat; opacity: 0.9"
            animation__pulse="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
          </a-sphere>
          <a-ring radius-inner="0.04" radius-outer="0.055" color="#CE93D8"
            rotation="-90 0 0" material="shader: flat; opacity: 0.4"
            animation__spin="property: rotation; to: -90 360 0; loop: true; dur: 3200; easing: linear">
          </a-ring>
        </a-entity>

      </a-entity>
    </a-entity>

    <a-camera position="0 0 0"></a-camera>

  </a-scene>

  <script src="script.js"></script>
</body>
</html>
